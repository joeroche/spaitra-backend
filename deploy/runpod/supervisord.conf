[unix_http_server]
file=/opt/spaitra/run/supervisor.sock
chmod=0700

[supervisord]
logfile=/opt/spaitra/logs/supervisord.log
pidfile=/opt/spaitra/run/supervisord.pid
childlogdir=/opt/spaitra/logs/supervisor
nodaemon=false
user=root

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///opt/spaitra/run/supervisor.sock

[program:spaitra-sshd]
command=/bin/bash -c "if ss -ltn | awk '{print $4}' | grep -q '[:.]22$'; then echo 'platform sshd already active'; exec sleep infinity; fi; exec /usr/sbin/sshd -D -e"
priority=10
autostart=true
autorestart=true
stdout_logfile=/opt/spaitra/logs/supervisor/spaitra-sshd.log
stderr_logfile=/opt/spaitra/logs/supervisor/spaitra-sshd.log

[program:ollama]
command=/bin/bash -c "set -a; source /etc/spaitra/.env 2>/dev/null || true; set +a; export HOME=/opt/spaitra OLLAMA_MODELS=/opt/spaitra/cache/ollama; if [ \"${ENABLE_OLLAMA_SERVICE:-1}\" != \"1\" ]; then echo 'ollama disabled via ENABLE_OLLAMA_SERVICE'; exec sleep infinity; fi; exec /usr/local/bin/ollama serve"
user=spaitra
directory=/opt/spaitra
priority=20
autostart=true
autorestart=true
stdout_logfile=/opt/spaitra/logs/supervisor/ollama.log
stderr_logfile=/opt/spaitra/logs/supervisor/ollama.log

[program:spaitra-ocr]
command=/bin/bash -c "set -a; source /etc/spaitra/.ocr.env; set +a; export HOME=/opt/spaitra HF_HOME=/opt/spaitra/cache/huggingface; cd /opt/spaitra/backend-copy; exec /opt/spaitra/venv-ocr/bin/python -m services.ocr.run"
user=spaitra
directory=/opt/spaitra/backend-copy
priority=30
autostart=true
autorestart=true
stdout_logfile=/opt/spaitra/logs/supervisor/spaitra-ocr.log
stderr_logfile=/opt/spaitra/logs/supervisor/spaitra-ocr.log

[program:spaitra-core]
command=/bin/bash -c "set -a; source /etc/spaitra/.env; set +a; export HOME=/opt/spaitra HF_HOME=/opt/spaitra/cache/huggingface OLLAMA_MODELS=/opt/spaitra/cache/ollama; cd /opt/spaitra/backend-copy; exec /opt/spaitra/venv-core/bin/gunicorn -w ${CORE_GUNICORN_WORKERS:-1} -k geventwebsocket.gunicorn.workers.GeventWebSocketWorker -b 127.0.0.1:5000 --worker-connections ${CORE_GUNICORN_WORKER_CONNECTIONS:-1000} --worker-tmp-dir /dev/shm --keep-alive 5 --timeout 0 --access-logfile - services.core.wsgi:application"
user=spaitra
directory=/opt/spaitra/backend-copy
priority=40
autostart=true
autorestart=true
stdout_logfile=/opt/spaitra/logs/supervisor/spaitra-core.log
stderr_logfile=/opt/spaitra/logs/supervisor/spaitra-core.log

[program:spaitra-tunnel]
command=/bin/bash -c "set -a; source /etc/spaitra/.env 2>/dev/null || true; set +a; export HOME=/opt/spaitra; if [ \"${ENABLE_SRVUS:-1}\" != \"1\" ]; then echo 'srv.us disabled via ENABLE_SRVUS'; exec sleep infinity; fi; if command -v srv.us >/dev/null 2>&1; then exec srv.us --port 5000; fi; exec ssh -i /etc/spaitra/ssh/id_ed25519 -o IdentitiesOnly=yes -o StrictHostKeyChecking=no -o ServerAliveInterval=30 -R 1:localhost:5000 srv.us"
user=spaitra
directory=/opt/spaitra
priority=50
autostart=true
autorestart=true
stdout_logfile=/opt/spaitra/logs/supervisor/spaitra-tunnel.log
stderr_logfile=/opt/spaitra/logs/supervisor/spaitra-tunnel.log
