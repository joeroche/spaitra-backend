<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="800" viewBox="0 0 1600 800" role="img" aria-labelledby="title desc">
  <title id="title">Spaitra personal visual-memory pipeline</title>
  <desc id="desc">A scene passes through YOLOE proposal generation. Each candidate crop receives a DINOv3 visual embedding and optional OCR and CLIP text embedding. The combined representation is compared with user-taught prototypes, optionally through a learned projection, then accepted or rejected. Accepted matches become sightings, spatial context, and narration. Teach and feedback build and adapt the memory index.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="memoryFill" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#102d2d"/>
      <stop offset="1" stop-color="#172554"/>
    </linearGradient>
    <marker id="arrowTeal" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 z" fill="#5eead4"/>
    </marker>
    <marker id="arrowViolet" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 z" fill="#a78bfa"/>
    </marker>
    <style>
      .title { font-size: 42px; font-weight: 700; fill: #f8fafc; }
      .subtitle { font-size: 22px; font-weight: 400; fill: #b8c4d6; }
      .step { font-size: 18px; font-weight: 700; letter-spacing: 1.8px; fill: #5eead4; }
      .heading { font-size: 26px; font-weight: 700; fill: #f8fafc; }
      .body { font-size: 20px; font-weight: 400; fill: #d6deea; }
      .small { font-size: 17px; font-weight: 400; fill: #aebbd0; }
      .mono { font-size: 20px; font-weight: 700; fill: #d8fff7; }
      .tealLine { stroke: #5eead4; stroke-width: 3; fill: none; marker-end: url(#arrowTeal); }
      .violetLine { stroke: #a78bfa; stroke-width: 3; fill: none; marker-end: url(#arrowViolet); }
    </style>
  </defs>

  <rect width="1600" height="800" fill="url(#background)"/>
  <g font-family="Arial">
    <text x="60" y="64" class="title">Detection is only the first step</text>
    <text x="60" y="101" class="subtitle">Spaitra turns candidate regions into matches against one person’s visual memory.</text>

    <text x="60" y="152" class="step">1 · PROPOSE</text>
    <rect x="60" y="174" width="270" height="340" rx="20" fill="#101a2b" stroke="#3a4a62" stroke-width="2"/>
    <text x="84" y="216" class="heading">Scene → YOLOE</text>
    <text x="84" y="246" class="small">prompt-free regions</text>
    <rect x="84" y="274" width="222" height="170" rx="12" fill="#0f1b2b" stroke="#2f4058" stroke-width="2"/>
    <path d="M84 409 L137 357 L180 389 L237 326 L306 397 L306 444 L84 444 Z" fill="#1c3348"/>
    <circle cx="270" cy="318" r="18" fill="#e9a94e"/>
    <rect x="105" y="312" width="75" height="67" fill="none" stroke="#5eead4" stroke-width="3"/>
    <rect x="191" y="333" width="92" height="78" fill="none" stroke="#5eead4" stroke-width="3"/>
    <text x="84" y="478" class="small">candidate boxes,</text>
    <text x="84" y="501" class="small">not object identities</text>

    <path d="M330 344 L370 344" class="tealLine"/>

    <text x="370" y="152" class="step">2 · REPRESENT EACH CROP</text>
    <rect x="370" y="174" width="410" height="340" rx="20" fill="#121d2a" stroke="#3a4a62" stroke-width="2"/>
    <rect x="396" y="204" width="116" height="80" rx="14" fill="#0e302e" stroke="#43cdb5" stroke-width="2"/>
    <text x="454" y="238" text-anchor="middle" class="mono">crop A</text>
    <text x="454" y="263" text-anchor="middle" class="small">crop B …</text>
    <path d="M512 244 L546 244" class="tealLine"/>
    <rect x="546" y="196" width="208" height="96" rx="14" fill="#172554" stroke="#60a5fa" stroke-width="2"/>
    <text x="570" y="233" class="heading">DINOv3</text>
    <text x="570" y="264" class="small">1,024-d appearance</text>

    <rect x="396" y="318" width="116" height="80" rx="14" fill="#0e302e" stroke="#43cdb5" stroke-width="2"/>
    <text x="454" y="351" text-anchor="middle" class="mono">if text-like</text>
    <text x="454" y="376" text-anchor="middle" class="small">crop heuristic</text>
    <path d="M512 358 L546 358" class="tealLine"/>
    <rect x="546" y="310" width="208" height="96" rx="14" fill="#27204a" stroke="#a78bfa" stroke-width="2"/>
    <text x="570" y="347" class="heading">OCR → CLIP</text>
    <text x="570" y="378" class="small">512-d weighted text</text>

    <path d="M650 292 L650 430" stroke="#5eead4" stroke-width="3"/>
    <rect x="475" y="430" width="245" height="60" rx="14" fill="#11333a" stroke="#5eead4" stroke-width="2"/>
    <text x="598" y="457" text-anchor="middle" class="heading">1,536-d vector</text>
    <text x="598" y="480" text-anchor="middle" class="small">normalized visual + text slots</text>

    <path d="M780 344 L820 344" class="tealLine"/>

    <text x="820" y="152" class="step">3 · MATCH PERSONAL MEMORY</text>
    <rect x="820" y="174" width="420" height="340" rx="20" fill="url(#memoryFill)" stroke="#43cdb5" stroke-width="2"/>
    <rect x="848" y="205" width="160" height="82" rx="14" fill="#0d3033" stroke="#43cdb5" stroke-width="2"/>
    <text x="928" y="239" text-anchor="middle" class="heading">Query crop</text>
    <text x="928" y="266" text-anchor="middle" class="small">current scene</text>
    <rect x="1052" y="205" width="160" height="82" rx="14" fill="#18284c" stroke="#60a5fa" stroke-width="2"/>
    <text x="1132" y="239" text-anchor="middle" class="heading">SQLite</text>
    <text x="1132" y="266" text-anchor="middle" class="small">labeled prototypes</text>
    <path d="M1008 246 L1052 246" class="tealLine"/>

    <rect x="874" y="321" width="312" height="76" rx="14" fill="#251a43" stroke="#a78bfa" stroke-width="2"/>
    <text x="1030" y="352" text-anchor="middle" class="heading">Learned projection</text>
    <text x="1030" y="380" text-anchor="middle" class="small">optional; same transform on both sides</text>
    <path d="M928 287 L928 321" class="violetLine"/>
    <path d="M1132 287 L1132 321" class="violetLine"/>

    <rect x="874" y="427" width="312" height="62" rx="14" fill="#152334" stroke="#5eead4" stroke-width="2"/>
    <text x="1030" y="454" text-anchor="middle" class="heading">Cosine retrieval</text>
    <text x="1030" y="479" text-anchor="middle" class="small">rank memories by label</text>
    <path d="M1030 397 L1030 427" class="tealLine"/>

    <path d="M1240 344 L1280 344" class="tealLine"/>

    <text x="1280" y="152" class="step">4 · DECIDE + RESPOND</text>
    <rect x="1280" y="174" width="260" height="340" rx="20" fill="#151f2f" stroke="#3a4a62" stroke-width="2"/>
    <text x="1306" y="216" class="heading">Accept or reject</text>
    <text x="1306" y="249" class="body">label threshold</text>
    <text x="1306" y="278" class="body">+ optional margin</text>
    <path d="M1306 305 L1514 305" stroke="#3a4a62" stroke-width="2"/>
    <text x="1306" y="339" class="small">accepted match</text>
    <text x="1306" y="370" class="body">save sighting</text>
    <text x="1306" y="399" class="body">deduplicate + order</text>
    <text x="1306" y="428" class="body">optional depth</text>
    <text x="1306" y="457" class="body">voice narration</text>

    <text x="60" y="566" class="step">TEACH + FEEDBACK BUILD THE MEMORY</text>
    <rect x="60" y="588" width="1480" height="156" rx="20" fill="#151f2f" stroke="#3a4a62" stroke-width="2"/>

    <rect x="88" y="616" width="245" height="100" rx="14" fill="#0e302e" stroke="#43cdb5" stroke-width="2"/>
    <text x="112" y="652" class="heading">Teach</text>
    <text x="112" y="681" class="body">user label + image</text>
    <text x="112" y="706" class="small">Grounding DINO crop</text>
    <path d="M333 666 L387 666" class="tealLine"/>

    <rect x="387" y="616" width="270" height="100" rx="14" fill="#11333a" stroke="#5eead4" stroke-width="2"/>
    <text x="411" y="652" class="heading">Same representation</text>
    <text x="411" y="681" class="body">visual + optional text</text>
    <text x="411" y="706" class="small">up to 3 prototypes per label</text>
    <path d="M657 666 C755 666 755 570 1132 570 L1132 514" class="tealLine"/>

    <rect x="740" y="616" width="270" height="100" rx="14" fill="#20183a" stroke="#a78bfa" stroke-width="2"/>
    <text x="764" y="652" class="heading">Correct / wrong</text>
    <text x="764" y="681" class="body">raw query-memory pairs</text>
    <text x="764" y="706" class="small">from the matching scan</text>
    <path d="M1010 666 L1064 666" class="violetLine"/>

    <rect x="1064" y="616" width="438" height="100" rx="14" fill="#251a43" stroke="#a78bfa" stroke-width="2"/>
    <text x="1088" y="652" class="heading">Triplets → residual projection head</text>
    <text x="1088" y="681" class="body">hard-negative mining + gradual blend</text>
    <text x="1088" y="706" class="small">raw stored vectors remain unchanged</text>
    <path d="M1283 616 C1283 566 1030 566 1030 514" class="violetLine"/>
  </g>
</svg>
